[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-safety-platform"
version = "0.1.0"
description = "Enterprise construction-safety inspection platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["packages/shared/python", "packages/contracts/python", "src/api-gateway/python", "src/ingestion/python"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/shared/python", "packages/contracts/python", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/shared/python:packages/contracts/python:src/api-gateway/python:src/ingestion/python"
files = ["packages/shared/python", "packages/contracts/python", "src/api-gateway/python", "src/ingestion/python"]
